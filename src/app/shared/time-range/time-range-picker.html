<div class="picker">
  <mat-button-toggle-group
    aria-label="Zakres czasu"
    hideSingleSelectionIndicator
    [value]="preset()"
    (change)="choosePreset($event.value)"
  >
    @for (option of presets; track option.value) {
      <mat-button-toggle [value]="option.value">{{ option.label }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Własny zakres</mat-label>
    <mat-date-range-input [rangePicker]="rangePicker" [max]="today">
      <input
        matStartDate
        placeholder="Od"
        [value]="days()?.[0] ?? null"
        (dateChange)="start.set($event.value)"
      />
      <input
        matEndDate
        placeholder="Do"
        [value]="days()?.[1] ?? null"
        (dateChange)="chooseDays([start(), $event.value])"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="rangePicker" />
    <mat-date-range-picker #rangePicker />
  </mat-form-field>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</div>
