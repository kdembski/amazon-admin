<div class="picker">
  <mat-form-field class="preset" subscriptSizing="dynamic">
    <mat-label>Zakres</mat-label>
    <mat-select [value]="preset()" (selectionChange)="choosePreset($event.value)">
      @for (option of presets; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="days" subscriptSizing="dynamic">
    <mat-label>Własny zakres</mat-label>
    <mat-date-range-input [rangePicker]="rangePicker" [max]="today">
      <input
        matStartDate
        placeholder="Od"
        [value]="days()?.[0] ?? null"
        (dateChange)="start.set($event.value)"
      />
      <input
        matEndDate
        placeholder="Do"
        [value]="days()?.[1] ?? null"
        (dateChange)="chooseDays([start(), $event.value])"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="rangePicker" />
    <mat-date-range-picker #rangePicker />
  </mat-form-field>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</div>
