<h1>Overview</h1>

<section class="summary" aria-label="Summary">
  @if (summary.data(); as periods) {
    <app-summary-panels [periods]="periods" />
  } @else if (summary.error(); as error) {
    <p class="error" role="alert">Failed to load the summary: {{ error }}</p>
  } @else {
    <app-summary-skeleton />
  }
</section>

<app-range-panel heading="Scraped ads" [source]="scraped" [chart]="true">
  @if (scraped.data(); as chart) {
    <app-time-series-chart
      [series]="chart.series"
      [fill]="true"
      [unit]="chart.unit"
      [pointLabels]="true"
    />
  }
</app-range-panel>

<app-range-panel heading="New and deleted ads" [source]="adChange" [chart]="true">
  @if (adChange.data(); as chart) {
    <app-time-series-chart [series]="chart.series" type="bar" [unit]="chart.unit" />
  }
</app-range-panel>

<app-range-panel heading="Sent anomalies" [source]="anomalies" [chart]="true">
  @if (anomalies.data(); as chart) {
    <app-time-series-chart
      [series]="chart.series"
      type="bar"
      [stacked]="true"
      [unit]="chart.unit"
    />
  }
</app-range-panel>
