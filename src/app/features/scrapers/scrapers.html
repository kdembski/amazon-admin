<h1>Scrapers</h1>

<app-summary-section
  label="Scraper summary"
  storageKey="scrapers-summary-height"
  [defaultHeight]="250"
  [source]="summary"
/>

<app-range-panel heading="Status (last hour average)" [source]="statuses" [ranged]="false">
  @if (statuses.data(); as rows) {
    <app-scraper-status-list [rows]="rows" />
  }
</app-range-panel>

<app-range-panel heading="Items/s" [source]="items" [chart]="true">
  @if (items.data(); as chart) {
    <app-time-series-chart [series]="chart.series" [unit]="chart.unit" />
  }
</app-range-panel>

<app-grouped-chart-panel heading="Wasted %" [source]="wasted" />
<app-grouped-chart-panel heading="Attempts/item" [source]="attempts" />
<app-grouped-chart-panel heading="Captcha %" [source]="captcha" />
<app-grouped-chart-panel heading="503 %" [source]="http503" />

<app-range-panel heading="Transfer in + out (MB) per country" [source]="transfer" [chart]="true">
  <app-country-toggle panelActions [source]="transfer" label="Transfer countries" />
  @if (transfer.chart(); as chart) {
    <app-time-series-chart [series]="chart.series" [unit]="chart.unit" />
  }
</app-range-panel>
